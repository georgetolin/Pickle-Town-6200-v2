name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Firebase config from GitHub Secrets
        env:
          FIREBASE_API_KEY:            ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:        ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:       ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:         ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:     ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:             ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:     ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          cat > firebase-config.js << 'ENDSCRIPT'
          /**
           * PickleTown 6200 — Firebase Configuration
           * Auto-generated by GitHub Actions from repository secrets.
           * Do NOT commit this file — it is injected at deploy time.
           */
          const firebaseConfig = {
            apiKey:            "PLACEHOLDER_API_KEY",
            authDomain:        "PLACEHOLDER_AUTH_DOMAIN",
            databaseURL:       "PLACEHOLDER_DATABASE_URL",
            projectId:         "PLACEHOLDER_PROJECT_ID",
            storageBucket:     "PLACEHOLDER_STORAGE_BUCKET",
            messagingSenderId: "PLACEHOLDER_MESSAGING_SENDER_ID",
            appId:             "PLACEHOLDER_APP_ID",
            measurementId:     "PLACEHOLDER_MEASUREMENT_ID"
          };
          firebase.initializeApp(firebaseConfig);
          const db   = firebase.database();
          const auth = firebase.auth();
          const googleProvider   = new firebase.auth.GoogleAuthProvider();
          const facebookProvider = new firebase.auth.FacebookAuthProvider();
          ENDSCRIPT

          sed -i "s|PLACEHOLDER_API_KEY|${FIREBASE_API_KEY}|g"                       firebase-config.js
          sed -i "s|PLACEHOLDER_AUTH_DOMAIN|${FIREBASE_AUTH_DOMAIN}|g"               firebase-config.js
          sed -i "s|PLACEHOLDER_DATABASE_URL|${FIREBASE_DATABASE_URL}|g"             firebase-config.js
          sed -i "s|PLACEHOLDER_PROJECT_ID|${FIREBASE_PROJECT_ID}|g"                 firebase-config.js
          sed -i "s|PLACEHOLDER_STORAGE_BUCKET|${FIREBASE_STORAGE_BUCKET}|g"         firebase-config.js
          sed -i "s|PLACEHOLDER_MESSAGING_SENDER_ID|${FIREBASE_MESSAGING_SENDER_ID}|g" firebase-config.js
          sed -i "s|PLACEHOLDER_APP_ID|${FIREBASE_APP_ID}|g"                         firebase-config.js
          sed -i "s|PLACEHOLDER_MEASUREMENT_ID|${FIREBASE_MEASUREMENT_ID}|g"         firebase-config.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
